name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Copy web assets to www/
        run: npm run build

      - name: Add Android platform
        run: npx --yes cap add android

      - name: Sync web to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: micoche-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # El Release solo sirve como via de descarga publica del APK
      # (los artifacts exigen iniciar sesion en GitHub). Se reemplaza en cada build.
      - name: Publish APK as Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk micoche-debug.apk
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest micoche-debug.apk \
            --title "MICOCHE APK (debug)" \
            --notes "APK de depuracion generado automaticamente en cada push. Commit: ${{ github.sha }}" \
            --target "${{ github.sha }}"
